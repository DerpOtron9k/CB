<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date Logic Calculator</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        padding: 2rem;
        background: #f3f4f6;
        color: #1f2933;
      }

      h1 {
        margin-top: 0;
      }

      .card {
        max-width: 480px;
        background: #ffffff;
        padding: 1.5rem;
        border-radius: 0.75rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
      }

      label {
        display: block;
        margin-bottom: 1rem;
        font-weight: 600;
      }

      input[type="date"],
      select {
        margin-top: 0.35rem;
        width: 100%;
        padding: 0.65rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.5rem;
        font-size: 1rem;
        box-sizing: border-box;
      }

      input[type="date"]:focus,
      select:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
      }

      .result {
        margin-top: 1.5rem;
        padding: 1rem;
        background: #f8fafc;
        border-radius: 0.75rem;
        border: 1px solid #e2e8f0;
      }

      .result h2 {
        margin: 0 0 0.75rem 0;
        font-size: 1.15rem;
      }

      .shortcut-card {
        margin-top: 1.5rem;
        padding: 1rem;
        background: #eff6ff;
        border-radius: 0.75rem;
        border: 1px solid #bfdbfe;
      }

      .shortcut-card h2 {
        margin: 0 0 0.75rem 0;
        font-size: 1.05rem;
      }

      .result dt {
        font-weight: 600;
      }

      .result dd {
        margin: 0 0 0.75rem 0;
      }

      .muted {
        color: #64748b;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Date Logic Calculator</h1>
      <p class="muted">
        Pick a date and logic to calculate the resulting day based on your rules.
      </p>
      <label>
        Choose a date
        <input type="date" id="date-input" />
      </label>
      <label>
        Calculation logic
        <select id="logic-select">
          <option value="35y+60d">35y + 60d adjustment</option>
        </select>
      </label>
      <section class="shortcut-card" id="shortcut-card" aria-live="polite">
        <h2>Shortcut</h2>
        <p class="muted">Select a date to see a quick subtraction summary.</p>
      </section>
      <section class="result" id="result" aria-live="polite">
        <h2>Result</h2>
        <p class="muted">Select a date to see the calculated day.</p>
      </section>
    </main>
    <script>
      const dateInput = document.getElementById("date-input");
      const logicSelect = document.getElementById("logic-select");
      const resultContainer = document.getElementById("result");
      const shortcutCard = document.getElementById("shortcut-card");

      function parseDate(value) {
        if (!value) return null;
        const [year, month, day] = value.split("-").map(Number);
        if (!year || !month || !day) return null;
        return new Date(Date.UTC(year, month - 1, day));
      }

      function formatDate(date) {
        return date.toLocaleDateString(undefined, {
          year: "numeric",
          month: "long",
          day: "numeric",
          timeZone: "UTC",
        });
      }

      function addYears(date, years) {
        const result = new Date(date);
        result.setUTCFullYear(result.getUTCFullYear() + years);
        return result;
      }

      function addDays(date, days) {
        const result = new Date(date);
        result.setUTCDate(result.getUTCDate() + days);
        return result;
      }

      function daysBetween(start, end) {
        const msPerDay = 24 * 60 * 60 * 1000;
        return Math.round((end - start) / msPerDay);
      }

      function normalizeToUTC(date) {
        const normalized = new Date(date);
        normalized.setUTCHours(0, 0, 0, 0);
        return normalized;
      }

      function getFirstOfNextMonth(date) {
        const result = new Date(date);
        result.setUTCDate(1);
        result.setUTCMonth(result.getUTCMonth() + 1);
        return result;
      }

      function calculate35yPlus60d(selectedDate) {
        const thirtyFiveYearsBack = addYears(selectedDate, -35);
        const firstOfNextMonth = getFirstOfNextMonth(selectedDate);
        const gapToNextMonth = daysBetween(selectedDate, firstOfNextMonth);
        const daysToSubtract = gapToNextMonth + 60;
        const adjustedDate = addDays(thirtyFiveYearsBack, -daysToSubtract);

        return {
          finalDate: adjustedDate,
          steps: {
            thirtyFiveYearsBack,
            firstOfNextMonth,
            gapToNextMonth,
            daysToSubtract,
          },
        };
      }

      function renderResult(calculation) {
        if (!calculation) {
          resultContainer.innerHTML = `
            <h2>Result</h2>
            <p class="muted">Select a date to see the calculated day.</p>
          `;
          return;
        }

        const { finalDate, steps } = calculation;
        const template = `
          <h2>Result</h2>
          <dl>
            <dt>Gap to next month</dt>
            <dd>${steps.gapToNextMonth} day(s)</dd>
            <dt>Gap + 60 days to subtract</dt>
            <dd>${steps.daysToSubtract} day(s)</dd>
            <dt>35 years back</dt>
            <dd>${formatDate(steps.thirtyFiveYearsBack)}</dd>
            <dt>Final outcome</dt>
            <dd>${formatDate(finalDate)}</dd>
          </dl>
        `;

        resultContainer.innerHTML = template;
      }

      function renderShortcut(calculation, baseDate) {
        if (!shortcutCard) return;

        if (!calculation || !baseDate) {
          if (fallbackShortcut) {
            const { calculation: fallbackCalc, baseDate: fallbackBaseDate } =
              fallbackShortcut;
            shortcutCard.innerHTML = `
              <h2>Shortcut</h2>
              <p>
                Next upcoming result lands on <strong>${formatDate(
                  fallbackCalc.finalDate
                )}</strong>.
              </p>
              <p class="muted">
                Derived from ${formatDate(
                  fallbackBaseDate
                )} by subtracting ${fallbackCalc.steps.daysToSubtract} day(s)
                (gap of ${fallbackCalc.steps.gapToNextMonth} + 60).
              </p>
            `;
            return;
          }

          shortcutCard.innerHTML = `
            <h2>Shortcut</h2>
            <p class="muted">Select a date to see a quick subtraction summary.</p>
          `;
          return;
        }

        shortcutCard.innerHTML = `
          <h2>Shortcut</h2>
          <p>
            For <strong>${formatDate(baseDate)}</strong>, subtract <strong>${
              calculation.steps.daysToSubtract
            }</strong> day(s)
            (gap of ${calculation.steps.gapToNextMonth} + 60) from the 35-year-back date.
          </p>
          <p class="muted">
            35 years back: ${formatDate(
              calculation.steps.thirtyFiveYearsBack
            )}. Result: ${formatDate(calculation.finalDate)}.
          </p>
        `;
      }

      function findClosestFutureResultFor35yPlus60d(targetDate) {
        const searchWindowDays = 40 * 366;
        const normalizedTarget = normalizeToUTC(targetDate);

        for (let dayOffset = 0; dayOffset <= searchWindowDays; dayOffset++) {
          const baseDate = addDays(normalizedTarget, dayOffset);
          const calculation = calculate35yPlus60d(baseDate);
          if (calculation.finalDate >= normalizedTarget) {
            return { baseDate, calculation };
          }
        }

        return null;
      }

      const fallbackShortcut = findClosestFutureResultFor35yPlus60d(new Date());
      renderShortcut(null, null);

      function handleChange() {
        const selectedDate = parseDate(dateInput.value);
        if (!selectedDate) {
          renderResult(null);
          renderShortcut(null, null);
          return;
        }

        let calculation = null;
        switch (logicSelect.value) {
          case "35y+60d":
            calculation = calculate35yPlus60d(selectedDate);
            break;
          default:
            calculation = null;
        }
        renderResult(calculation);
        if (calculation) {
          renderShortcut(calculation, selectedDate);
        }
      }

      dateInput.addEventListener("change", handleChange);
      logicSelect.addEventListener("change", handleChange);
    </script>
  </body>
</html>
