<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date Logic Calculator</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        --bg-gradient: radial-gradient(circle at top, #eef2ff, #e0f2fe 45%, #f8fafc 100%);
        --card-bg: rgba(255, 255, 255, 0.9);
        --card-border: rgba(148, 163, 184, 0.2);
        --text-color: #0f172a;
        --muted-color: #64748b;
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.12);
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
        background: var(--bg-gradient);
        color: var(--text-color);
      }

      main {
        width: min(500px, 100%);
      }

      h1 {
        margin: 0 0 0.25rem 0;
        font-size: clamp(1.65rem, 3vw, 2rem);
        letter-spacing: -0.01em;
      }

      .card {
        background: var(--card-bg);
        padding: 2.25rem;
        border-radius: 1.5rem;
        border: 1px solid var(--card-border);
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(6px);
        transition: transform 200ms ease, box-shadow 200ms ease;
      }

      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 26px 60px rgba(15, 23, 42, 0.16);
      }

      label {
        display: block;
        margin-bottom: 1rem;
        font-weight: 600;
        color: var(--muted-color);
        font-size: 0.95rem;
      }

      input[type="date"],
      select {
        margin-top: 0.35rem;
        width: 100%;
        padding: 0.65rem;
        border: 1px solid rgba(148, 163, 184, 0.6);
        border-radius: 0.75rem;
        font-size: 1rem;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.85);
        transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }

      input[type="date"]:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
        transform: translateY(-1px);
      }

      .result {
        margin-top: 2rem;
        padding: 1.35rem;
        background: rgba(241, 245, 249, 0.9);
        border-radius: 1rem;
        border: 1px solid rgba(148, 163, 184, 0.25);
        position: relative;
        overflow: hidden;
      }

      .result h2 {
        margin: 0 0 0.75rem 0;
        font-size: 1.15rem;
        color: var(--accent);
      }

      .result dt {
        font-weight: 600;
        color: var(--text-color);
      }

      .result dd {
        margin: 0 0 0.75rem 0;
        color: var(--muted-color);
      }

      .result::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.08), transparent 60%);
        pointer-events: none;
      }

      .muted {
        color: var(--muted-color);
        font-size: 0.95rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Date Logic Calculator</h1>
      <p class="muted">
        Pick a date and logic to calculate the resulting day based on your rules.
      </p>
      <label>
        Choose a date
        <input type="date" id="date-input" />
      </label>
      <label>
        Calculation logic
        <select id="logic-select">
          <option value="35y+60d">35y + 60d adjustment</option>
        </select>
      </label>
      <section class="result" id="result" aria-live="polite">
        <h2>Result</h2>
        <p class="muted">Select a date to see the calculated day.</p>
      </section>
    </main>
    <script>
      const dateInput = document.getElementById("date-input");
      const logicSelect = document.getElementById("logic-select");
      const resultContainer = document.getElementById("result");

      function parseDate(value) {
        if (!value) return null;
        const [year, month, day] = value.split("-").map(Number);
        if (!year || !month || !day) return null;
        return new Date(Date.UTC(year, month - 1, day));
      }

      function formatDate(date) {
        return date.toLocaleDateString(undefined, {
          year: "numeric",
          month: "long",
          day: "numeric",
          timeZone: "UTC",
        });
      }

      function addYears(date, years) {
        const result = new Date(date);
        result.setUTCFullYear(result.getUTCFullYear() + years);
        return result;
      }

      function addDays(date, days) {
        const result = new Date(date);
        result.setUTCDate(result.getUTCDate() + days);
        return result;
      }

      function daysBetween(start, end) {
        const msPerDay = 24 * 60 * 60 * 1000;
        return Math.round((end - start) / msPerDay);
      }

      function getFirstOfNextMonth(date) {
        const result = new Date(date);
        result.setUTCDate(1);
        result.setUTCMonth(result.getUTCMonth() + 1);
        return result;
      }

      function calculate35yPlus60d(selectedDate) {
        const thirtyFiveYearsBack = addYears(selectedDate, -35);
        const minusSixtyDays = addDays(thirtyFiveYearsBack, -60);
        const firstOfNextMonth = getFirstOfNextMonth(selectedDate);
        const gapToNextMonth = daysBetween(selectedDate, firstOfNextMonth);
        const adjustedDate = addDays(minusSixtyDays, gapToNextMonth);

        return {
          finalDate: adjustedDate,
          steps: {
            thirtyFiveYearsBack,
            minusSixtyDays,
            firstOfNextMonth,
            gapToNextMonth,
          },
        };
      }

      function renderResult(calculation) {
        if (!calculation) {
          resultContainer.innerHTML = `
            <h2>Result</h2>
            <p class="muted">Select a date to see the calculated day.</p>
          `;
          return;
        }

        const { finalDate, steps } = calculation;
        const template = `
          <h2>Result</h2>
          <dl>
            <dt>35 years back</dt>
            <dd>${formatDate(steps.thirtyFiveYearsBack)}</dd>
            <dt>Minus 60 days</dt>
            <dd>${formatDate(steps.minusSixtyDays)}</dd>
            <dt>Gap to next month</dt>
            <dd>${steps.gapToNextMonth} day(s)</dd>
            <dt>Adjusted result</dt>
            <dd>${formatDate(finalDate)}</dd>
          </dl>
        `;

        resultContainer.innerHTML = template;
      }

      function handleChange() {
        const selectedDate = parseDate(dateInput.value);
        if (!selectedDate) {
          renderResult(null);
          return;
        }

        let calculation = null;
        switch (logicSelect.value) {
          case "35y+60d":
            calculation = calculate35yPlus60d(selectedDate);
            break;
          default:
            calculation = null;
        }
        renderResult(calculation);
      }

      dateInput.addEventListener("change", handleChange);
      logicSelect.addEventListener("change", handleChange);
    </script>
  </body>
</html>
